<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleopatra Press - نظام إدارة المطبعة</title>
</head>
<body style="margin:0;padding:0;background:#0b0b0d;">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap');

:root{
  --bg:#0b0b0d; --bg2:#141417; --card:#18191d; --card2:#1f2025;
  --border:#2a2b31; --text:#eceef1; --sub:#9a9ca3;
  --red:#e01e2b; --red2:#ff3b4a; --silver:#c7c9ce; --silver2:#8a8d93;
  --ok:#2ecc71; --warn:#f0a500;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
}
[data-theme="light"]{
  --bg:#f2f1ee; --bg2:#ffffff; --card:#ffffff; --card2:#f7f6f4;
  --border:#e2e0da; --text:#1c1c1e; --sub:#68676c;
  --red:#c8102e; --red2:#e01e2b; --silver:#6b6e76; --silver2:#4d5058;
  --ok:#1f9d55; --warn:#b4790a;
  --shadow: 0 10px 24px rgba(0,0,0,.08);
}
*{box-sizing:border-box;}
.cp-root{
  font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; direction:rtl; text-align:right; transition:background .3s,color .3s;
  padding:0; margin:0; border-radius:14px; overflow:hidden;
}
.cp-shell{max-width:1100px;margin:0 auto;padding:22px 20px 120px;}
.cp-h1,.cp-h2,.cp-h3{font-family:'Cairo',sans-serif;}
.cp-h1{font-size:26px;font-weight:800;letter-spacing:.3px;}
.cp-h2{font-size:19px;font-weight:700;}
.cp-h3{font-size:15px;font-weight:700;color:var(--sub);}
.cp-topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg2);
}
.cp-brand{display:flex;align-items:center;gap:10px;}
.cp-brand img{height:34px;width:34px;object-fit:contain;border-radius:8px;filter:drop-shadow(0 0 6px rgba(224,30,43,.5));}
.cp-brand b{font-family:'Cairo';font-weight:800;font-size:16px;}
.cp-brand span{color:var(--red2);}
.cp-topright{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);}
.cp-iconbtn{
  background:var(--card2);border:1px solid var(--border);color:var(--text);
  width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.cp-iconbtn:hover{border-color:var(--red);color:var(--red2);}
.cp-card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:20px;margin-bottom:16px;box-shadow:var(--shadow);
}
.cp-grid{display:grid;gap:14px;}
.cp-grid.cols-2{grid-template-columns:1fr 1fr;}
.cp-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
.cp-grid.cols-4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media(max-width:720px){.cp-grid.cols-2,.cp-grid.cols-3,.cp-grid.cols-4{grid-template-columns:1fr;}}
.cp-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.cp-field label{font-size:12.5px;color:var(--sub);font-weight:700;}
.cp-input, .cp-select{
  background:var(--bg2);border:1px solid var(--border);color:var(--text);
  padding:11px 12px;border-radius:10px;font-size:14px;font-family:'Tajawal';outline:none;
}
.cp-input:focus,.cp-select:focus{border-color:var(--red);}
.cp-btn{
  background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border:none;
  padding:12px 20px;border-radius:11px;font-weight:700;cursor:pointer;font-size:14.5px;
  font-family:'Cairo';box-shadow:0 6px 16px rgba(224,30,43,.35);transition:.15s;
}
.cp-btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
.cp-btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);box-shadow:none;}
.cp-btn.ghost{background:transparent;color:var(--red2);border:1px solid var(--red);box-shadow:none;}
.cp-btn:disabled{opacity:.4;cursor:not-allowed;}
.cp-btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.cp-tile{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;cursor:pointer;transition:.18s;text-align:center;}
.cp-tile:hover{border-color:var(--red);transform:translateY(-3px);box-shadow:var(--shadow);}
.cp-tile.disabled{opacity:.4;cursor:not-allowed;}
.cp-tile .ic{font-size:30px;margin-bottom:8px;}
.cp-row{display:flex;gap:10px;align-items:center;}
.cp-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;background:rgba(224,30,43,.12);color:var(--red2);}
.cp-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.cp-table th{text-align:right;color:var(--sub);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);}
.cp-table td{padding:8px 10px;border-bottom:1px solid var(--border);}
.cp-table input{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:7px;font-size:13px;}
.cp-autocomplete{position:relative;}
.cp-suggest{position:absolute;top:100%;right:0;left:0;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-top:4px;max-height:200px;overflow:auto;z-index:20;box-shadow:var(--shadow);}
.cp-suggest div{padding:10px 12px;cursor:pointer;font-size:13.5px;}
.cp-suggest div:hover{background:var(--card2);color:var(--red2);}
.cp-back{cursor:pointer;color:var(--sub);font-size:13px;margin-bottom:14px;display:inline-flex;gap:6px;align-items:center;}
.cp-back:hover{color:var(--red2);}
.cp-login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.cp-login-card{width:100%;max-width:380px;text-align:center;}
.cp-logo-hero{width:110px;height:110px;object-fit:contain;margin:0 auto 10px;filter:drop-shadow(0 0 22px rgba(224,30,43,.55));}
.cp-summary-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:14px;}
.cp-summary-line.total{font-weight:800;font-size:17px;border-bottom:none;padding-top:14px;color:var(--red2);font-family:'Cairo';}
.cp-alert{background:rgba(240,165,0,.1);border:1px solid var(--warn);color:var(--warn);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;}
.cp-empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:14px;}
::placeholder{color:var(--sub);opacity:.7;}
.cp-cartbar{position:fixed;bottom:0;right:0;left:0;background:var(--card);border-top:2px solid var(--red);padding:12px 20px;box-shadow:0 -8px 24px rgba(0,0,0,.3);z-index:40;}
.cp-cartbar-inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.cp-cart-items{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;}
.cp-cart-chip{background:var(--card2);border:1px solid var(--border);padding:5px 10px;border-radius:20px;display:flex;gap:6px;align-items:center;}
.cp-cart-chip button{background:none;border:none;color:var(--red2);cursor:pointer;font-size:13px;}
.cp-total-box{
  background:linear-gradient(135deg,#0d8a5f,#0aa66e);border:1px solid #0aa66e;border-radius:14px;
  padding:16px 18px;text-align:center;margin-bottom:10px;
}
.cp-total-box-amount{font-family:'Cairo';font-weight:800;font-size:36px;color:#fff;line-height:1.3;}
.cp-remaining-box{
  background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 16px;
  font-family:'Cairo';font-weight:700;font-size:15px;text-align:center;
}
/* مفتاح تبديل (Toggle Switch) */
.cp-toggle{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
.cp-toggle input{opacity:0;width:0;height:0;}
.cp-toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:24px;transition:.2s;}
.cp-toggle-slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
.cp-toggle input:checked + .cp-toggle-slider{background:var(--red);}
.cp-toggle input:checked + .cp-toggle-slider:before{transform:translateX(-18px);}
/* بطاقة تفاصيل التكلفة */
.cp-cost-card .cp-cost-line{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border);font-size:14px;}
.cp-cost-line .lbl{display:flex;align-items:center;gap:8px;}
.cp-cost-line.total-line{border-bottom:none;padding-top:12px;font-weight:800;font-family:'Cairo';font-size:16px;}
.cp-cost-line.final-line{color:var(--red2);font-weight:800;font-family:'Cairo';font-size:18px;}
.cp-cost-line.unit-line{color:#4da6ff;font-weight:800;font-family:'Cairo';}
.cp-cartbar-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:820px){.cp-cartbar-grid{grid-template-columns:1fr;}}
.cp-order-details{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.cp-od-row{padding:4px 0;font-size:13px;}
.cp-od-row.cp-od-sub{color:var(--sub);font-size:12px;}
.cp-od-row.cp-od-pair{display:flex;justify-content:space-between;gap:10px;}
.cp-optgroup-label{font-weight:800;}
.cp-tabbar{display:flex;border-bottom:2px solid var(--border);margin-bottom:18px;gap:4px;}
.cp-tabbtn{
  flex:1;text-align:center;padding:14px 10px;cursor:pointer;font-weight:700;font-family:'Cairo';
  background:var(--card2);border:1px solid var(--border);border-bottom:none;border-radius:12px 12px 0 0;
  color:var(--sub);transition:.15s;
}
.cp-tabbtn:hover{color:var(--text);}
.cp-tabbtn.active{background:var(--card);color:var(--text);border-color:var(--red);box-shadow:0 -2px 0 var(--red) inset;}
.cp-tabbtn.disabled{opacity:.5;cursor:not-allowed;}
</style>

/* ===================== SIZE FAMILIES (internal reference table) ===================== */
/* Each family: fullSheet label + ordered sizes smallest->largest with count-per-full-sheet */
const DEFAULT_FAMILIES = {
  standard: {label:'الفرخ العادي (٧٠×١٠٠)', base:'regular', sizes:[
    ['12.5×17.5',32], ['17.5×25',16], ['25×35',8], ['35×50',4], ['50×70',2], ['70×100',1]
  ]},
  foolscap: {label:'فلوسكاب', base:'regular', sizes:[
    ['11.5×16.5',36], ['16.5×23',18], ['23×33',9]
  ]},
  extra1: {label:'مقاسات إضافية ١', base:'regular', sizes:[
    ['10×14',50], ['14×20',25], ['20×28',10], ['28×40',5]
  ]},
  extra2: {label:'مقاسات إضافية ٢', base:'regular', sizes:[
    ['10×15',44], ['15×20',22], ['20×30',11], ['30×40',5]
  ]},
  extra3: {label:'مقاسات إضافية ٣', base:'regular', sizes:[
    ['11.5×20',30], ['20×23',15], ['20×25',14], ['23×25',12]
  ]},
  gawab: {label:'الجواب', base:'regular', sizes:[
    ['11×14',44], ['14×22',22], ['22×28',10], ['28×42',5]
  ]},
  aSeries: {label:'مقاسات A', base:'regular', sizes:[
    ['A7',64], ['A6',32], ['A5',16], ['A4',8], ['A3',4], ['A2',2], ['A1',1]
  ]},
  koshiaGayer: {label:'الكوشية الجاير (٦٦×٨٨)', base:'gayer', sizes:[
    ['11×16.5',32], ['16.5×22',16], ['22×33',8], ['33×44',4], ['44×66',2], ['66×88',1]
  ]},
};
function getFamilies(){ return (STATE.settings && STATE.settings.families) ? STATE.settings.families : DEFAULT_FAMILIES; }
function famCount(familyKey, label){
  const fam = getFamilies()[familyKey]; if(!fam) return 1;
  const e = fam.sizes.find(s=>s[0]===label);
  return e ? e[1] : 1;
}
function parseSize(label){
  const parts = label.split('×');
  if(parts.length!==2) return null;
  const a = parseFloat(parts[0]), b = parseFloat(parts[1]);
  if(isNaN(a)||isNaN(b)) return null;
  return a*b;
}

/* ===================== TIERED GROUPS (دفاتر + ورق سايب على الفرخ العادي) =====================
   المقاس اللي بيدخله المستخدم (الحقيقي) يظهر في الفاتورة، لكن الحساب الداخلي بيستخدم "مقاس الحساب"
   المحدد حسب الجروب والكمية. الجروبات دي مبنية على جدول المقاسات نفسه. */
const GROUPS = {
  g1: {family:'extra2', below:'20×30', above:'30×40'},
  g2: {family:'standard', below:'25×35', above:'35×50'},
  g3: {family:'extra1', below:'20×28', above:'28×40'},
  g4: {family:'gawab', below:'22×28', above:'28×42'},
  g5: {family:'foolscap', below:'23×33', above:'23×33'}, // مقاس واحد ثابت مفيش تدرج بالكمية
  gA: {family:'aSeries', special:'A'},
};
const REAL_SIZES = [
  {label:'10×15', group:'g1'}, {label:'15×20', group:'g1'}, {label:'20×30', group:'g1'},
  {label:'12.5×17.5', group:'g2'}, {label:'17.5×25', group:'g2'}, {label:'25×35', group:'g2'},
  {label:'10×14', group:'g3'}, {label:'14×20', group:'g3'}, {label:'20×28', group:'g3'},
  {label:'11×14', group:'g4'}, {label:'14×22', group:'g4'}, {label:'22×28', group:'g4'},
  {label:'11.5×16.5', group:'g5'}, {label:'16.5×23', group:'g5'},
  {label:'A7',group:'gA'}, {label:'A6',group:'gA'}, {label:'A5',group:'gA'}, {label:'A4',group:'gA'},
];
function realSizeOptionsHTML(){
  return REAL_SIZES.map(s=>`<option value="${s.label}|${s.group}">${s.label}</option>`).join('');
}
/* بيرجع مقاس الحساب (الداخلي) + معامل التكرار + عدد قطع المقاس ده في الفرخ الكامل */
function resolveTieredCalc(groupId, realLabel, qty, threshold){
  const g = GROUPS[groupId];
  if(g.special==='A'){
    const calcLabel = (realLabel==='A4') ? (qty>10 ? 'A3':'A4') : (qty>=threshold ? 'A3':'A4');
    const repeat = Math.max(1, Math.round(famCount('aSeries',realLabel)/famCount('aSeries',calcLabel)));
    return {calcLabel, repeat, calcCount: famCount('aSeries', calcLabel)};
  }
  const calcLabel = g.below===g.above ? g.below : (qty>=threshold ? g.above : g.below);
  let repeat = 1;
  if(calcLabel!==realLabel){
    const a = parseSize(realLabel), b = parseSize(calcLabel);
    repeat = (a&&b) ? Math.max(1, Math.round(b/a)) : 1;
  }
  return {calcLabel, repeat, calcCount: famCount(g.family, calcLabel)};
}

/* ============================================================================================
   دالة مستقلة تمامًا لحساب تراجات الترقيم - منفصلة كليًا عن حساب الطباعة (resolveTieredCalc).
   السبب: ماكينة الترقيم أقصى مقاس تستوعبه 33×23 سم، فأي فرخ طباعة أكبر من كده لازم يتحول
   لمقاس ترقيم أصغر ومتوافق مع الماكينة. القواعد دي عملية تشغيل فعلية في المطبعة، مش تقريب.
   ملحوظة: الدالة دي ما بتستدعيش resolveTieredCalc ولا أي جزء من حساب الطباعة إطلاقًا.
   ============================================================================================ */
function numberingArea(label){
  const parts = label.split('×');
  if(parts.length!==2) return null;
  const a = parseFloat(parts[0]), b = parseFloat(parts[1]);
  if(isNaN(a)||isNaN(b)) return null;
  return a*b;
}
const NUMBERING_RULES = {
  g1: {targetLabel:'20×30', largeReal:'30×40'},
  g3: {targetLabel:'20×28', largeReal:'28×40'},
  g4: {targetLabel:'22×28', largeReal:'28×42'},
  g5: {targetLabel:'23×33', fixed:true},
  gA: {targetLabel:'A4', special:'A', largeReal:'A3'},
};
// المجموعة الثانية استثناء: تحويل صريح لكل مقاس، وبدون أي مضاعفة إطلاقًا (زي ما اتقال بالظبط)
const NUMBERING_GROUP2_MAP = { '12.5×17.5':'17.5×25', '17.5×25':'17.5×25', '25×35':'25×35' };

/**
 * calculateNumberingSheets(groupId, realLabel)
 * بترجع: { targetLabel: فرخ الترقيم المستخدم, repeat: معامل التكرار }
 * ملحوظة: بعد المراجعة مع المطبعة، تراجات الترقيم بتتحسب دايمًا بنفس معامل التكرار على
 * فرخ الترقيم الثابت للمجموعة - من غير أي مضاعفة (×2) حتى لو فرخ الطباعة طلع كبير للكمية.
 */
function calculateNumberingSheets(groupId, realLabel){
  if(groupId==='g2'){
    const targetLabel = NUMBERING_GROUP2_MAP[realLabel] || realLabel;
    if(targetLabel===realLabel) return {targetLabel, repeat:1};
    const a1 = numberingArea(realLabel), a2 = numberingArea(targetLabel);
    const repeat = (!a1||!a2) ? 1 : Math.max(1, Math.round(a2/a1));
    return {targetLabel, repeat};
  }
  const rule = NUMBERING_RULES[groupId];
  if(!rule) return {targetLabel: realLabel, repeat:1};

  if(rule.special==='A'){
    const repeat = Math.max(1, Math.round(famCount('aSeries', realLabel)/famCount('aSeries','A4')));
    return {targetLabel:'A4', repeat};
  }

  // g1 / g3 / g4 / g5: نفس المنطق - تحويل مباشر لفرخ الترقيم الثابت، من غير أي مضاعفة
  const a1 = numberingArea(realLabel), a2 = numberingArea(rule.targetLabel);
  const repeat = (rule.targetLabel===realLabel || !a1 || !a2) ? 1 : Math.max(1, Math.round(a2/a1));
  return {targetLabel: rule.targetLabel, repeat};
}

/**
 * cpPrintDoc: يطبع مستند HTML كامل (فاتورة/أمر شغل/تقرير) من غير الاعتماد على window.open().
 * السبب: window.open() بيترفض جوه الـ iframe المعزول اللي شغال بيه النظام هنا (زي بيئة
 * الـ Artifact) لو مفيهاش صلاحية "allow-popups"، وده كان بيكسر كل شاشات الطباعة بنفس الخطأ.
 * الحل: نطبع من خلال iframe مخفي في نفس الصفحة (مش نافذة جديدة)، وده مسموح دايمًا.
 */
function cpPrintDoc(fullHtml){
  let iframe = document.getElementById('cp-print-iframe');
  if(!iframe){
    iframe = document.createElement('iframe');
    iframe.id = 'cp-print-iframe';
    iframe.style.cssText = 'position:fixed;left:-99999px;top:0;width:1px;height:1px;border:0;';
    document.body.appendChild(iframe);
  }
  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(fullHtml);
  doc.close();
  // تأخير بسيط عشان أي صور (اللوجو أو QR) تتحمل قبل ما نفتح نافذة الطباعة
  iframe.onload = () => {
    try{ iframe.contentWindow.focus(); iframe.contentWindow.print(); }catch(e){ console.error(e); }
  };
  setTimeout(() => {
    try{ iframe.contentWindow.focus(); iframe.contentWindow.print(); }catch(e){ console.error(e); }
  }, 400);
}

const PAYMENT_METHODS = ['كاش','فودافون كاش','Instapay','حساب بنكي'];
function cpCollectionNumbers(){
  const total = STATE.cart.reduce((s,i)=>s+i.breakdown.total,0);
  const netProfit = STATE.cart.reduce((s,i)=>s+((i.breakdown.total||0)-(i.breakdown.subtotal||0)), 0);
  const profitPercent = STATE.settings.profitPercent; // نسبة الربح الثابتة من الإعدادات - للعرض فقط، ما بتتغيرش من هنا
  const discount = STATE.cbDiscount || 0;
  const afterDiscount = total * (1 - discount/100);
  const vatOn = !!STATE.cbVatOn;
  const vatAmount = vatOn ? afterDiscount * 0.14 : 0;
  const finalTotal = afterDiscount + vatAmount;
  const payments = (STATE.cbPayments && STATE.cbPayments.length) ? STATE.cbPayments : [{method:PAYMENT_METHODS[0], amount:0}];
  const paidTotal = payments.reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const remaining = finalTotal - paidTotal;
  return {total, netProfit, profitPercent, discount, vatOn, vatAmount, finalTotal, payments, paidTotal, remaining};
}

async function cpDoFinalize(){
  if(STATE.cart.length===0){ showToast('الفاتورة فاضية'); return null; }
  const n = cpCollectionNumbers();
  const invoice = {
    id: uid(), clientId: STATE.selectedClient.id, clientName: STATE.selectedClient.name,
    employee: STATE.employee.name, date: new Date().toISOString(),
    items: STATE.cart, grandTotal: n.total,
    discountPercent: n.discount, vatOn: n.vatOn, vatAmount: n.vatAmount, finalTotal: n.finalTotal,
    netProfit: n.netProfit, profitPercent: n.profitPercent,
    payments: n.payments, paidAmount: n.paidTotal, remaining: n.remaining,
    deliveryDate: STATE.cbDeliveryDate||'', paymentTerms: STATE.cbPaymentTerms||'',
    customerNotes: STATE.cbCustomerNotes||'', internalNotes: STATE.cbInternalNotes||'',
    status: ORDER_STATUSES[0],
  };
  const latestOrders = await storeGet('cp_orders', STATE.orders);
  latestOrders.unshift(invoice);
  const ok = await storeSet('cp_orders', latestOrders);
  STATE.orders = latestOrders;
  STATE.cart = [];
  STATE.showFinalizeForm = false;
  cpResetCartBarFields();
  STATE.historyClientFilter = '';
  STATE.historySearch = '';
  if(ok){ showToast('تم حفظ الفاتورة بنجاح ✅'); }
  else{ alert('⚠️ تم إنشاء الفاتورة في الجلسة الحالية، لكن حصل خطأ في حفظها بشكل دائم. جرب تطبع نسخة فورًا.'); }
  return invoice;
}

function dashboardStats(){
  const orders = STATE.orders;
  const today = new Date(); today.setHours(0,0,0,0);
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  let todayRevenue=0, monthRevenue=0, totalRevenue=0;
  const byClient = {};
  orders.forEach(o=>{
    const d = new Date(o.date);
    totalRevenue += o.grandTotal;
    if(d>=today) todayRevenue += o.grandTotal;
    if(d>=monthStart) monthRevenue += o.grandTotal;
    byClient[o.clientId] = (byClient[o.clientId]||0) + o.grandTotal;
  });
  const topClients = Object.entries(byClient).map(([id,total])=>({
    id, total, name:(STATE.clients.find(c=>c.id===id)||{}).name || '—'
  })).sort((a,b)=>b.total-a.total).slice(0,5);
  let income=0, expense=0;
  STATE.treasury.forEach(t=>{ if(t.type==='income') income+=t.amount; else if(t.type==='expense') expense+=t.amount; });
  const treasuryBalance = income - expense;
  let suppliersDebt = 0;
  STATE.suppliers.forEach(s=>{
    const purchased = (s.purchases||[]).reduce((sum,p)=>sum+p.amount,0);
    const paid = (s.payments||[]).reduce((sum,p)=>sum+p.amount,0);
    suppliersDebt += (purchased-paid);
  });
  return {todayRevenue, monthRevenue, totalRevenue, invoicesCount:orders.length, topClients, treasuryBalance, suppliersDebt};
}

  STATE.clientSearch = v; STATE.selectedClient = null;

  }
  box.innerHTML = html;
};

function looseFormHTML(){
  return `
  <div class="cp-card">
    <div class="cp-grid cols-3">
      <div class="cp-field"><label>اسم/موديل الشغلانة</label><input class="cp-input" id="lp_model" placeholder="مثال: فاتورة مقاس فلوسكاب"/></div>
      <div class="cp-field"><label>نوع الفرخ الأساسي</label>${baseSelectHTML('lp')}</div>

      <div class="cp-field"><label>عدد الألوان</label><input class="cp-input" id="lp_colors" type="number" value="1"/></div>

      <div class="cp-field"><label>هل يوجد تصميم؟</label>${designToggleHTML('lp')}</div>
      ${numberingToggleHTML('lp')}
      <div class="cp-field"><label>أفرخ التهدير الإضافية</label><input class="cp-input" id="lp_waste" type="number" value="${STATE.settings.wasteSheetsDefault}"/></div>
    </div>
    <button class="cp-btn" onclick="cpCalcLoose()">احسب</button>
  </div>
  <div id="lp_result"></div>`;
}
window.cpCalcLoose = function(){
  const modelName = document.getElementById('lp_model').value.trim();
  const base = document.getElementById('lp_base').value;
  const paper = (STATE.settings.sheetTypes[base]||[]).find(p=>p.id===document.getElementById('lp_paper').value);
  const sizeVal = document.getElementById('lp_size').value; // regular: "label|group"  |  gayer: "famKey|label"
  const qty = parseFloat(document.getElementById('lp_qty').value)||0;
  const colors = parseFloat(document.getElementById('lp_colors').value)||1;
  const inkColorName = document.getElementById('lp_inkColor').value.trim();
  const sides = parseInt(document.getElementById('lp_sides').value)||1;
  const waste = parseFloat(document.getElementById('lp_waste').value)||0;
  const designMode = document.getElementById('lp_design').value;
  const numbered = document.getElementById('lp_numbered').value==='yes';
  const numStart = numbered ? (document.getElementById('lp_numStart').value||'1') : null;
  if(qty<=0){ showToast('ادخل عدد الورق'); return; }
  if(!paper){ showToast('اختار نوع ورق'); return; }
  const S = STATE.settings;

  let realLabel, sheetsNeeded, calcInfo=null, groupId=null;
  if(base==='gayer'){
    const [famKey, label] = sizeVal.split('|');
    realLabel = label;
    const repeat = directRepeat(famKey, label);
    sheetsNeeded = ceil(qty/repeat) + waste;
  }else{
    const [label, gId] = sizeVal.split('|');
    realLabel = label; groupId = gId;
    calcInfo = resolveTieredCalc(groupId, label, qty, S.looseThreshold);
    const units = qty / calcInfo.repeat;
    sheetsNeeded = ceil(units / calcInfo.calcCount) + waste;
  }
  const paperCost = sheetsNeeded * paper.price;
  const zincCost = S.zincPrice * colors;
  const printUnits = calcInfo ? (qty/calcInfo.repeat) : qty;
  const printRuns = ceil(printUnits/1000) * colors * sides;
  const printCost = printRuns * S.printRunPrice;

  // ===== الترقيم: دالة مستقلة تمامًا، منفصلة عن حساب الطباعة أعلاه =====
  let numberingRuns = 0, numberingCost = 0, numberingSheetUsed = null, numEnd = null;
  if(numbered){
    if(groupId){ // الفرخ العادي (فيه تدرج مقاسات) - نطبق قاعدة الترقيم المستقلة
      const numInfo = calculateNumberingSheets(groupId, realLabel);
      const numberingUnits = qty / numInfo.repeat;
      numberingRuns = ceil(numberingUnits/1000);
      numberingSheetUsed = numInfo.targetLabel;
    }else{ // الفرخ الجاير - مفيش قاعدة تحويل خاصة معطاة، نحسب على نفس المقاس مباشرة
      numberingRuns = ceil(qty/1000);
      numberingSheetUsed = realLabel;
    }
    numberingCost = numberingRuns * S.numberingRunPrice;
    const startNum = parseInt(numStart)||1;
    numEnd = startNum + qty - 1;
  }
  const designCost = designMode==='new' ? S.designPrice : 0;

  const subtotal = paperCost + zincCost + printCost + numberingCost + designCost;
  const total = subtotal * (1 + S.profitPercent/100);
  const breakdown = {paper:paper.name, sheetBase:base, size:realLabel, qty, colors, inkColorName, sides, designMode, numbered, numStart, numEnd,
    wasteSheets:waste, sheetsNeeded, paperCost, zincCost, printRuns, printCost, printSheetUsed: calcInfo?calcInfo.calcLabel:realLabel,
    numberingCost, numberingRuns, numberingSheetUsed, designCost,
    profitPercent:S.profitPercent, subtotal, total};
  renderItemResult('lp_result', modelName, 'loose', breakdown, `
    ${designCost>0?`<div class="cp-summary-line"><span>🎨 التصميم</span><span>${fmt(designCost)} ج</span></div>`:''}
    <div class="cp-summary-line"><span>⚡ الزنكات (${colors} لون)</span><span>${fmt(zincCost)} ج</span></div>
    <div class="cp-summary-line"><span>🖨️ <b>الطباعة</b> — فرخ ${breakdown.printSheetUsed} (${printRuns} تراج${sides===2?' - وجهين':''})</span><span>${fmt(printCost)} ج</span></div>
    ${numbered?`<div class="cp-summary-line"><span>🔢 <b>الترقيم</b> — فرخ ${numberingSheetUsed} (${numberingRuns} تراج، من ${numStart} إلى ${numEnd})</span><span>${fmt(numberingCost)} ج</span></div>`:''}
    <div class="cp-summary-line"><span>عدد الأفرخ المطلوبة</span><span>${sheetsNeeded}</span></div>
    <div class="cp-summary-line"><span>📄 سعر الورق</span><span>${fmt(paperCost)} ج</span></div>`);
};

window.cpNbTypeChange = function(){ document.getElementById('nb_copiesWrap').style.display = document.getElementById('nb_type').value==='copies' ? 'flex':'none'; };
window.cpCalcNotebook = function(){
  const modelName = document.getElementById('nb_model').value.trim();
  const qty = parseFloat(document.getElementById('nb_qty').value)||0;
  if(qty<=0){ showToast('ادخل عدد الدفاتر'); return; }
  const type = document.getElementById('nb_type').value;
  const copies = type==='copies' ? (parseFloat(document.getElementById('nb_copies').value)||1) : 0;
  const colors = parseFloat(document.getElementById('nb_colors').value)||1;
  const numbered = document.getElementById('nb_numbered').value==='yes';
  const numStart = numbered ? (document.getElementById('nb_numStart').value||'1') : null;
  const designMode = document.getElementById('nb_design').value;
  const [realLabel, groupId] = document.getElementById('nb_size').value.split('|');
  const paper = (STATE.settings.sheetTypes.regular||[]).find(p=>p.id===document.getElementById('nb_paper').value);
  if(!paper){ showToast('اختار نوع ورق'); return; }
  const bindingUnit = parseFloat(document.getElementById('nb_binding').value)||0;
  const bindingType = document.getElementById('nb_bindingType').value.trim();
  const inkColorName = document.getElementById('nb_inkColor').value.trim();
  const waste = parseFloat(document.getElementById('nb_waste').value)||0;
  const S = STATE.settings;

  const sheetsPerNotebook = type==='original' ? 100 : (50 + 50*copies);
  const totalSheetsFlat = qty * sheetsPerNotebook;
  const calc = resolveTieredCalc(groupId, realLabel, qty, S.notebookThreshold);
  const units = totalSheetsFlat / calc.repeat;

  const printRuns = ceil(units/1000) * colors;
  const printCost = printRuns * S.printRunPrice;

  // ===== الترقيم: دالة مستقلة تمامًا، منفصلة عن حساب الطباعة أعلاه =====
  let numberingRuns = 0, numberingCost = 0, numberingSheetUsed = null, numEnd = null;
  if(numbered){
    const numInfo = calculateNumberingSheets(groupId, realLabel);
    const numberingUnits = totalSheetsFlat / numInfo.repeat;
    numberingRuns = ceil(numberingUnits/1000);
    numberingCost = numberingRuns * S.numberingRunPrice;
    numberingSheetUsed = numInfo.targetLabel;
    const startNum = parseInt(numStart)||1;
    // النهاية بتتحسب على عدد الورق الفعلي: 100 ورقة لكل دفتر (أصل فقط)، أو 50 لو فيه أصل+صور
    // (لأن الأصل والصورة بياخدوا نفس الرقم عن طريق الكربون، فمفيش رقم مستقل لكل صورة)
    const numberingUnitsPerNotebook = type==='original' ? 100 : 50;
    numEnd = startNum + (qty * numberingUnitsPerNotebook) - 1;
  }

  const sheetsNeeded = ceil(units / calc.calcCount) + waste;
  const paperCost = sheetsNeeded * paper.price;
  const zincCost = S.zincPrice * colors;
  const designCost = designMode==='new' ? S.designPrice : 0;
  const bindingCost = bindingUnit * qty;

  const subtotal = designCost + zincCost + printCost + numberingCost + paperCost + bindingCost;
  const total = subtotal * (1 + S.profitPercent/100);
  const breakdown = {qty, type, copies, colors, numbered, numStart, numEnd, designMode, size:realLabel,
    sheetBase:'regular', wasteSheets:waste,
    designCost, zincCost, printRuns, printCost, printSheetUsed: calc.calcLabel,
    numberingCost, numberingRuns, numberingSheetUsed,
    sheetsNeeded, paperCost, bindingCost, bindingType, inkColorName, paper: paper.name,
    profitPercent:S.profitPercent, subtotal, total};

  renderItemResult('nb_result', modelName, 'notebook', breakdown, `
    ${designCost>0?`<div class="cp-summary-line"><span>🎨 الكمبيوتر / التصميم</span><span>${fmt(designCost)} ج</span></div>`:''}
    <div class="cp-summary-line"><span>⚡ الزنكات (${colors} لون)</span><span>${fmt(zincCost)} ج</span></div>
    <div class="cp-summary-line"><span>🖨️ <b>الطباعة</b> — فرخ ${calc.calcLabel} (${printRuns} تراج)</span><span>${fmt(printCost)} ج</span></div>
    ${numbered? `<div class="cp-summary-line"><span>🔢 <b>الترقيم</b> — فرخ ${numberingSheetUsed} (${numberingRuns} تراج، من ${numStart} إلى ${numEnd})</span><span>${fmt(numberingCost)} ج</span></div>`:''}
    <div class="cp-summary-line"><span>📄 الورق (${sheetsNeeded} فرخ)</span><span>${fmt(paperCost)} ج</span></div>
    <div class="cp-summary-line"><span>📖 التقفيل${bindingType?' — '+bindingType:''}</span><span>${fmt(bindingCost)} ج</span></div>`);
};

window.cpCalcFolders = function(){
  const modelName = document.getElementById('fd_model').value.trim();
  const base = document.getElementById('fd_base').value;
  const paper = (STATE.settings.sheetTypes[base]||[]).find(p=>p.id===document.getElementById('fd_paper').value);
  const sizeVal = document.getElementById('fd_size').value;
  const qty = parseFloat(document.getElementById('fd_qty').value)||0;
  const colors = parseFloat(document.getElementById('fd_colors').value)||1;
  const inkColorName = document.getElementById('fd_inkColor').value.trim();
  const waste = parseFloat(document.getElementById('fd_waste').value)||0;
  const designMode = document.getElementById('fd_design').value;
  if(qty<=0){ showToast('ادخل عدد القطع'); return; }
  if(!paper){ showToast('اختار نوع ورق'); return; }
  const S = STATE.settings;

  let realLabel, sheetsNeeded, printUnits;
  if(base==='gayer'){
    const [famKey, label] = sizeVal.split('|');
    realLabel = label;
    const repeat = directRepeat(famKey, label);
    sheetsNeeded = ceil(qty/repeat) + waste;
    printUnits = qty;
  }else{
    const [label, groupId] = sizeVal.split('|');
    realLabel = label;
    const calc = resolveTieredCalc(groupId, label, qty, S.looseThreshold);
    const units = qty / calc.repeat;
    sheetsNeeded = ceil(units / calc.calcCount) + waste;
    printUnits = units;
  }
  const paperCost = sheetsNeeded * paper.price;
  const zincCost = S.zincPrice * colors;
  const printRuns = ceil(printUnits/1000) * colors;
  const printCost = printRuns * S.printRunPrice;
  const designCost = designMode==='new' ? S.designPrice : 0;

  const rizaVal = parseFloat(document.getElementById('fd_riza').value); const riza = isNaN(rizaVal)?0:rizaVal;
  const jarabVal = parseFloat(document.getElementById('fd_jarab').value); const jarab = isNaN(jarabVal)?0:jarabVal;
  const formaVal = parseFloat(document.getElementById('fd_forma').value); const forma = isNaN(formaVal)?0:formaVal;
  const taksirVal = parseFloat(document.getElementById('fd_taksir').value); const taksir = isNaN(taksirVal)?0:taksirVal;
  const selloOn = document.getElementById('fd_sello_toggle').checked;
  const selloType = document.getElementById('fd_selloType').value.trim();
  const sello = selloOn ? sheetsNeeded * STATE.settings.sellophanePricePerSheet : 0;

  const subtotal = designCost + zincCost + printCost + paperCost + riza + jarab + forma + taksir + sello;
  const total = subtotal * (1 + STATE.settings.profitPercent/100);
  const breakdown = {paper:paper.name, sheetBase:base, size:realLabel, qty, colors, inkColorName, wasteSheets:waste, designMode, designCost, zincCost, printRuns, printCost,
    sheetsNeeded, paperCost, riza, jarab, forma, taksir, sello, selloType, profitPercent:STATE.settings.profitPercent, subtotal, total};
  renderItemResult('fd_result', modelName, 'folders', breakdown, `
    ${designCost>0?`<div class="cp-summary-line"><span>🎨 التصميم</span><span>${fmt(designCost)} ج</span></div>`:''}
    <div class="cp-summary-line"><span>⚡ الزنكات (${colors} لون)</span><span>${fmt(zincCost)} ج</span></div>
    <div class="cp-summary-line"><span>🖨️ الطباعة (${printRuns} تراج)</span><span>${fmt(printCost)} ج</span></div>
    <div class="cp-summary-line"><span>📄 الورق (${sheetsNeeded} فرخ)</span><span>${fmt(paperCost)} ج</span></div>
    ${riza>0?`<div class="cp-summary-line"><span>ريجة</span><span>${fmt(riza)} ج</span></div>`:''}
    ${sello>0?`<div class="cp-summary-line"><span>سلوفان</span><span>${fmt(sello)} ج</span></div>`:''}
    ${jarab>0?`<div class="cp-summary-line"><span>جراب داخلي</span><span>${fmt(jarab)} ج</span></div>`:''}
    ${forma>0?`<div class="cp-summary-line"><span>فورمة</span><span>${fmt(forma)} ج</span></div>`:''}
    ${taksir>0?`<div class="cp-summary-line"><span>تكسير وتلزيق</span><span>${fmt(taksir)} ج</span></div>`:''}`);
};

/* ===================== لوحات وإعلانات (قسم مستقل بالكامل) =====================
   ملاحظة: القسم ده مستقل تمامًا عن الأوفست (ورق سايب/دفاتر/أظرف/فولدرات) وله قواعد
   حساب خاصة به (بالمتر المربع أو بعدد القطع في المتر)، ومحوش أي تعديل على أي قسم موجود.
   =============================================================================== */
const BOARDS_MATERIALS = [
  {id:'banner', label:'بنر', category:'banner'},
  {id:'vinylPrintCut', label:'فنيل برنت اند كت', category:'vinylPrintCut'},
  {id:'vinylNormal', label:'فنيل عادي', category:'vinylNormal'},
  {id:'flex', label:'فلكس', category:'flex'},
  {id:'seasro', label:'سيسرو', category:'seasro'},
];
function boardsUnitPrice(category, S, opts){
  switch(category){
    case 'banner': return opts.designMode==='new' ? S.boardsBannerWithDesign : S.boardsBannerNoDesign;
    case 'vinylNormal': return opts.selloOn ? S.boardsVinylNormalWithSello : S.boardsVinylNormalNoSello;
    case 'vinylPrintCut': return opts.selloOn ? S.boardsVinylPrintCutWithSello : S.boardsVinylPrintCutNoSello;
    case 'flex': return S.boardsFlex;
    case 'seasro': return S.boardsSeasro;
    default: return 0;
  }
}
function boardsStages(category, selloOn){
  const stages = ['التصميم','التجهيز','الطباعة','القص'];
  if((category==='vinylNormal'||category==='vinylPrintCut') && selloOn) stages.push('السلوفان');
  stages.push('التشطيب','التسليم');
  return stages;
}
/** محرك حساب اللوحات - مستقل تمامًا عن أي محرك حساب تاني في النظام */
function computeBoards(input, S){
  const mat = BOARDS_MATERIALS.find(m=>m.id===input.materialId);
  const category = mat.category;
  const unitPrice = boardsUnitPrice(category, S, {designMode:input.designMode, selloOn:input.selloOn});

  if(category==='vinylPrintCut'){
    const gapCM = (S.boardsGapMM||5)/10;
    const w = input.pieceWidthCM, h = input.pieceHeightCM;
    const perRow = Math.max(1, Math.floor((100+gapCM)/(w+gapCM)));
    const perCol = Math.max(1, Math.floor((100+gapCM)/(h+gapCM)));
    const piecesPerMeter = Math.max(1, perRow*perCol);
    const metersNeeded = ceil(input.qty/piecesPerMeter);
    const total = metersNeeded * unitPrice;
    return {
      material: mat.label, category, size:`${w}×${h} سم`, qty:input.qty,
      piecesPerMeter, metersNeeded, unitPrice, selloOn:!!input.selloOn,
      unitLabel:'متر طولي', total, subtotal: total,
      stages: boardsStages(category, input.selloOn),
    };
  }

  const widthM = input.widthCM/100, heightM = input.heightCM/100;
  const pieceArea = widthM*heightM;
  const totalArea = pieceArea*input.qty;
  const total = totalArea*unitPrice;
  return {
    material: mat.label, category, size:`${input.widthCM}×${input.heightCM} سم`, qty:input.qty,
    pieceArea, totalArea, unitPrice, designMode:input.designMode, selloOn:!!input.selloOn,
    unitLabel:'م²', total, subtotal: total,
    stages: boardsStages(category, input.selloOn),
  };
}

/** يبني مستند الفاتورة/عرض السعر كـ HTML كامل - يشتغل مع فاتورة محفوظة (o.items) أو مع كارت لسه ماتحفظش */
function cpInvoiceDocumentHTML(o, opts){
  opts = opts || {};
  const isQuotation = !!opts.isQuotation;
  const itemsRows = o.items.map(i=>{
    const qty = i.breakdown.qty || 1;
    const unitPrice = i.breakdown.total / qty;
    return `<tr><td>${kindLabel(i.kind)}</td><td>${i.modelName||'-'}</td><td>${i.breakdown.size||'-'}</td><td>${i.breakdown.qty||'-'}</td><td>${fmt(unitPrice)} ج</td><td>${fmt(i.breakdown.total)} ج</td></tr>`;
  }).join('');
  const grandTotal = o.grandTotal;
  const discountPercent = o.discountPercent||0;
  const discountAmount = grandTotal * discountPercent/100;
  // توافق مع الفواتير القديمة (taxPercent) والجديدة (vatOn/vatAmount)
  let vatAmount, vatLabel;

    .cp-account-box .cell{min-width:140px;}
    .cp-account-box b.label{color:#666;display:block;font-size:11px;font-weight:normal;}
    table{width:100%;border-collapse:collapse;margin-top:10px;}
    th,td{border:1px solid #ccc;padding:8px;text-align:right;font-size:13px;}
    th{background:#f5f5f5;}
    .cp-inv-total-box{background:#0aa66e;color:#fff;border-radius:12px;padding:16px 20px;text-align:center;margin-top:16px;}
    .cp-inv-total-box .amount{font-size:30px;font-weight:bold;color:#fff;}
    .cp-collect-box{margin-top:12px;border:1px solid #ccc;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:bold;text-align:center;
      background:${remaining>0.009?'#fdecec':'#eafaf0'};color:${remaining>0.009?'#c8102e':'#1f9d55'};}

    <img src="${logoSrc()}"/>
  </div>
  <div class="cp-inv-meta">
    <div><b>${docNumberLabel}:</b> ${(o.id||'DRAFT').slice(-8).toUpperCase()}<br/><b>التاريخ:</b> ${new Date(o.date).toLocaleDateString('ar-EG')}<br/>${isQuotation? `<b>صالح حتى:</b> ${validUntil}` : (o.deliveryDate?`<b>موعد التسليم:</b> ${o.deliveryDate}`:'')}</div>
    <div><b>العميل:</b> ${o.clientName}<br/>${client.phone ? '<b>الهاتف:</b> '+client.phone : ''}</div>
  </div>

  <div class="cp-account-box">
    <div class="row">
      <div class="cell"><b class="label">الإجمالي قبل الخصم</b>${fmt(grandTotal)} ج</div>
      <div class="cell"><b class="label">الخصم (${discountPercent}%)</b>-${fmt(discountAmount)} ج</div>
      <div class="cell"><b class="label">${vatLabel}</b>+${fmt(vatAmount)} ج</div>

/* ===================== طباعة أمر الشغل (للورشة - مستند واحد لكل الفاتورة) ===================== */
function cpWorkOrderDocumentHTML(o){
  const client = STATE.clients.find(c=>c.id===o.clientId) || {};
  const qrData = encodeURIComponent(`WorkOrder:${o.id}|Client:${o.clientName}`);
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${qrData}`;

  const itemBlocks = o.items.map((it,idx)=>{
    const b = it.breakdown;
    const rows = [];
    rows.push(['الموديل', it.modelName || '-']);
    if(b.size) rows.push(['المقاس النهائي (للعميل)', b.size]);
    if(b.printSheetUsed) rows.push(['مقاس الطباعة (داخلي)', b.printSheetUsed + (b.printRuns?` — ${b.printRuns} تراج`:'')]);
    if(b.numberingSheetUsed) rows.push(['مقاس الترقيم (داخلي)', b.numberingSheetUsed + (b.numberingRuns?` — ${b.numberingRuns} تراج`:'')]);
    if(b.numbered) rows.push(['الترقيم', `من ${b.numStart} إلى ${b.numEnd}`]);
    if(b.type) rows.push(['نوع المحتوى', b.type==='original' ? 'أصل فقط' : `أصل + ${b.copies} صورة`]);
    if(b.qty) rows.push(['الكمية', b.qty]);
    if(b.sheetsNeeded) rows.push(['عدد أفرخ الورق المطلوبة', b.sheetsNeeded]);
    if(b.paper) rows.push(['نوع الورق', b.paper]);
    if(b.colors) rows.push(['عدد الألوان', b.colors]);
    if(b.inkColorName) rows.push(['لون الحبر', b.inkColorName]);
    if(b.bindingType) rows.push(['نوع التجليد', b.bindingType]);
    if(b.selloType) rows.push(['نوع السلوفان', b.selloType]);
    if(b.material) rows.push(['الخامة', b.material]);
    if(b.designMode) rows.push(['التصميم', b.designMode==='new'?'تصميم جديد':'التصميم جاهز']);
    return `
    <div style="border:1px solid #999;border-radius:6px;padding:12px;margin-bottom:14px;page-break-inside:avoid;">
      <div style="background:#222;color:#fff;padding:6px 10px;border-radius:4px;font-weight:bold;margin-bottom:8px;">بند ${idx+1}: ${kindLabel(it.kind)}</div>
      <table>${rows.map(([k,v])=>`<tr><td style="width:35%;background:#f5f5f5;font-weight:bold;">${k}</td><td>${v}</td></tr>`).join('')}</table>
    </div>`;
  }).join('');

  return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>أمر شغل - ${o.clientName}</title>
  <style>
    @page{size:A4;margin:12mm;}
    body{font-family:Tahoma,Arial,sans-serif;color:#111;}
    .wo-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #000;padding-bottom:10px;margin-bottom:14px;}
    .wo-head h1{margin:0;font-size:20px;}
    table{width:100%;border-collapse:collapse;}
    td{padding:6px 8px;border:1px solid #ccc;font-size:13px;}
    .wo-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;font-size:13px;}
    .wo-meta div{border:1px solid #ccc;padding:8px;border-radius:6px;}
    .wo-notes{margin-top:10px;font-size:13px;}
  </style></head><body>
  <div class="wo-head">
    <div><h1>أمر شغل — Work Order</h1><div style="font-size:12px;color:#555;">Cleopatra Press</div></div>
    <img src="${qrUrl}" width="90" height="90"/>
  </div>
  <div class="wo-meta">
    <div><b>رقم أمر الشغل:</b> ${(o.id||'DRAFT').slice(-8).toUpperCase()}<br/><b>تاريخ الإنشاء:</b> ${new Date(o.date).toLocaleDateString('ar-EG')}<br/><b>موعد التسليم:</b> ${o.deliveryDate||'-'}</div>
    <div><b>العميل:</b> ${o.clientName}<br/><b>الهاتف:</b> ${client.phone||'-'}<br/><b>الموظف المسؤول:</b> ${o.employee||'-'}</div>
  </div>
  ${itemBlocks}
  <div class="wo-notes">
    <div><b>ملاحظات العميل:</b> ${o.customerNotes||'-'}</div>
    <div><b>ملاحظات داخلية:</b> ${o.internalNotes||'-'}</div>
    <div style="margin-top:10px;"><b>الحالة الحالية:</b> ${o.status||ORDER_STATUSES[0]}</div>
  </div>
  </body></html>`;
}

/* ============================================================================
   الوحدات الإدارية الجديدة (خزينة / موردون / مناقصات / تقارير)
   ملحوظة: كل الوحدات دي إضافية بالكامل ومفيهاش أي لمس لمنطق التسعير أو الطلبات
   أو الفواتير أو المقاسات أو الترقيم - دول برضو المرجع النهائي زي ما هو تمامًا.
   ============================================================================ */

/* ----------------- الخزينة ----------------- */
function treasuryBalance(){
  let income=0, expense=0;
  STATE.treasury.forEach(t=>{ if(t.type==='income') income+=t.amount; else if(t.type==='expense') expense+=t.amount; });
  return income-expense;
}
function screenTreasury(){
  let rows = STATE.treasury.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(STATE.treasuryTypeFilter) rows = rows.filter(t=>t.type===STATE.treasuryTypeFilter);
  if(STATE.treasurySearch) rows = rows.filter(t=>(t.note||'').includes(STATE.treasurySearch) || (t.category||'').includes(STATE.treasurySearch));
  if(STATE.treasuryFrom) rows = rows.filter(t=>new Date(t.date) >= new Date(STATE.treasuryFrom));
  if(STATE.treasuryTo) rows = rows.filter(t=>new Date(t.date) <= new Date(STATE.treasuryTo+'T23:59:59'));
  const typeLabel = {income:'إيراد', expense:'مصروف', transfer:'تحويل'};
  const balance = treasuryBalance();

  return `
  ${back('home')}
  <div class="cp-h1" style="margin-bottom:6px;">الخزينة</div>
  <div class="cp-card" style="text-align:center;">
    <div class="cp-h3">الرصيد الحالي</div>
    <div class="cp-h1" style="font-size:26px;color:${balance>=0?'var(--ok)':'var(--red2)'};">${fmt(balance)} ج</div>
  </div>

  <div class="cp-card">
    <div class="cp-h3" style="margin-bottom:10px;">تسجيل حركة جديدة</div>
    <div class="cp-grid cols-3">
      <div class="cp-field"><label>نوع الحركة</label>
        <select class="cp-select" id="tr_type"><option value="income">إيراد</option><option value="expense">مصروف</option><option value="transfer">تحويل</option></select>
      </div>
      <div class="cp-field"><label>المبلغ</label><input class="cp-input" id="tr_amount" type="number"/></div>
      <div class="cp-field"><label>البند / التصنيف</label><input class="cp-input" id="tr_category" placeholder="مثال: إيجار، خامات، تحصيل عميل"/></div>
      <div class="cp-field" style="grid-column:span 2;"><label>ملاحظات</label><input class="cp-input" id="tr_note"/></div>
      <div class="cp-field"><label>التاريخ</label><input class="cp-input" id="tr_date" type="date" value="${new Date().toISOString().slice(0,10)}"/></div>
    </div>
    <button class="cp-btn" onclick="cpAddTreasury()">+ تسجيل الحركة</button>
  </div>

  <div class="cp-card">
    <div class="cp-h3" style="margin-bottom:10px;">كشف الحساب</div>
    <div class="cp-grid cols-4">
      <input class="cp-input" placeholder="بحث..." value="${STATE.treasurySearch}" oninput="cpTreasurySearch(this.value)"/>
      <select class="cp-select" onchange="cpTreasuryFilterType(this.value)">
        <option value="">كل الأنواع</option>
        <option value="income" ${STATE.treasuryTypeFilter==='income'?'selected':''}>إيراد</option>
        <option value="expense" ${STATE.treasuryTypeFilter==='expense'?'selected':''}>مصروف</option>
        <option value="transfer" ${STATE.treasuryTypeFilter==='transfer'?'selected':''}>تحويل</option>
      </select>
      <input class="cp-input" type="date" value="${STATE.treasuryFrom}" onchange="cpTreasuryDate('from',this.value)"/>
      <input class="cp-input" type="date" value="${STATE.treasuryTo}" onchange="cpTreasuryDate('to',this.value)"/>
    </div>
    <table class="cp-table" style="margin-top:10px;">
      <thead><tr><th>التاريخ</th><th>النوع</th><th>البند</th><th>ملاحظات</th><th>المبلغ</th><th></th></tr></thead>
      <tbody>${rows.map(t=>`<tr><td>${t.date}</td><td>${typeLabel[t.type]}</td><td>${t.category||'-'}</td><td>${t.note||'-'}</td>
        <td style="color:${t.type==='expense'?'var(--red2)':'var(--ok)'}">${t.type==='expense'?'-':''}${fmt(t.amount)} ج</td>
        <td><button class="cp-btn sm ghost" onclick="cpDeleteTreasury('${t.id}')">حذف</button></td></tr>`).join('') || `<tr><td colspan="6" class="cp-empty">لا يوجد حركات</td></tr>`}</tbody>
    </table>
    <button class="cp-btn secondary sm" style="margin-top:10px;" onclick="cpPrintTreasury()">🖨️ طباعة كشف الحساب</button>
  </div>`;
}
window.cpAddTreasury = async function(){
  const type = document.getElementById('tr_type').value;
  const amount = parseFloat(document.getElementById('tr_amount').value)||0;
  if(amount<=0){ showToast('ادخل مبلغ صحيح'); return; }
  const t = {id:uid(), type, amount, category:document.getElementById('tr_category').value.trim(),
    note:document.getElementById('tr_note').value.trim(), date:document.getElementById('tr_date').value || new Date().toISOString().slice(0,10),
    employee: STATE.employee.name};
  STATE.treasury.unshift(t);
  await storeSet('cp_treasury', STATE.treasury);
  showToast('تم تسجيل الحركة'); render();
};

window.cpPrintTreasury = function(){
  const typeLabel = {income:'إيراد', expense:'مصروف', transfer:'تحويل'};

  cpPrintDoc(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>كشف حساب الخزينة</title>
  <style>body{font-family:Tahoma,Arial,sans-serif;padding:30px;} table{width:100%;border-collapse:collapse;margin-top:20px;} th,td{border:1px solid #ccc;padding:8px;text-align:right;} h1{color:#c8102e;}</style></head>

  <h2>الرصيد الحالي: ${fmt(treasuryBalance())} ج</h2>

};

/* ----------------- الموردون ----------------- */
function supplierBalance(s){
  const purchased = (s.purchases||[]).reduce((sum,p)=>sum+p.amount,0);
  const paid = (s.payments||[]).reduce((sum,p)=>sum+p.amount,0);
  return purchased - paid; // موجب = علينا مديونية للمورد
}
function screenSuppliers(){
  let list = STATE.suppliers;
  if(STATE.supplierSearch) list = list.filter(s=>s.name.includes(STATE.supplierSearch));
  return `
  ${back('home')}
  <div class="cp-h1" style="margin-bottom:14px;">الموردون</div>
  <div class="cp-card">
    <div class="cp-grid cols-3">
      <div class="cp-field"><label>اسم المورد</label><input class="cp-input" id="sup_name" placeholder="مثال: مورد الورق الأول"/></div>
      <div class="cp-field"><label>رقم الهاتف</label><input class="cp-input" id="sup_phone"/></div>
      <div class="cp-field"><label>ملاحظات</label><input class="cp-input" id="sup_notes"/></div>
    </div>
    <button class="cp-btn" onclick="cpAddSupplier()">+ إضافة مورد</button>
  </div>
  <div class="cp-card">

  </div>
  <div class="cp-card">
    <table class="cp-table"><thead><tr><th>المورد</th><th>الهاتف</th><th>المديونية الحالية</th><th></th></tr></thead>
    <tbody>${list.map(s=>{
      const bal = supplierBalance(s);
      return `<tr><td>${s.name}</td><td>${s.phone||'-'}</td>
      <td style="color:${bal>0?'var(--warn)':'var(--ok)'}">${fmt(bal)} ج</td>

      <button class="cp-btn sm ghost" onclick="cpDeleteSupplier('${s.id}')">حذف</button></td></tr>`;
    }).join('') || `<tr><td colspan="4" class="cp-empty">لا يوجد موردون بعد</td></tr>`}</tbody></table>
  </div>`;
}

  showToast('تمت إضافة المورد'); render();

window.cpDeleteSupplier = async function(id){ STATE.suppliers = STATE.suppliers.filter(s=>s.id!==id); await storeSet('cp_suppliers', STATE.suppliers); render(); };

function screenSupplierDetail(){
  const s = STATE.suppliers.find(x=>x.id===STATE.selectedSupplierId);
  if(!s) return `${back('suppliers')}<div class="cp-empty">المورد غير موجود</div>`;
  const bal = supplierBalance(s);
  const ledger = [
    ...(s.purchases||[]).map(p=>({date:p.date, type:'شراء', amount:p.amount, note:p.desc})),
    ...(s.payments||[]).map(p=>({date:p.date, type:'دفعة', amount:-p.amount, note:p.note})),
  ].sort((a,b)=>new Date(a.date)-new Date(b.date));

window.cpAddSupplierPurchase = async function(){

window.cpAddSupplierPayment = async function(){

window.cpAddTender = async function(){
  const title = document.getElementById('tn_title').value.trim();
  if(!title){ showToast('اكتب عنوان المناقصة'); return; }
  STATE.tenders.unshift({id:uid(), client:document.getElementById('tn_client').value.trim(), title,
    value:parseFloat(document.getElementById('tn_value').value)||0, deadline:document.getElementById('tn_deadline').value,
    status:document.getElementById('tn_status').value, notes:document.getElementById('tn_notes').value.trim()});
  await storeSet('cp_tenders', STATE.tenders);
  showToast('تمت إضافة المناقصة'); render();
};
window.cpUpdateTenderStatus = async function(id, status){
  const t = STATE.tenders.find(x=>x.id===id); if(t){ t.status=status; await storeSet('cp_tenders', STATE.tenders); }
};
window.cpDeleteTender = async function(id){ STATE.tenders = STATE.tenders.filter(t=>t.id!==id); await storeSet('cp_tenders', STATE.tenders); render(); };

/* ----------------- التقارير ----------------- */
function screenReports(){
  let orders = STATE.orders;
  if(STATE.reportsFrom) orders = orders.filter(o=>new Date(o.date) >= new Date(STATE.reportsFrom));
  if(STATE.reportsTo) orders = orders.filter(o=>new Date(o.date) <= new Date(STATE.reportsTo+'T23:59:59'));

  const totalRevenue = orders.reduce((s,o)=>s+o.grandTotal,0);
  const byKind = {};
  const byClient = {};
  const byModel = {};
  orders.forEach(o=>{
    byClient[o.clientName] = (byClient[o.clientName]||0) + o.grandTotal;
    o.items.forEach(i=>{
      byKind[i.kind] = (byKind[i.kind]||0) + i.breakdown.total;
      const modelKey = i.modelName || kindLabel(i.kind);
      byModel[modelKey] = (byModel[modelKey]||0) + 1;
    });
  });
  const topClients = Object.entries(byClient).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const topModels = Object.entries(byModel).sort((a,b)=>b[1]-a[1]).slice(0,10);

  return `
  ${back('home')}
  <div class="cp-h1" style="margin-bottom:14px;">التقارير</div>
  <div class="cp-card">
    <div class="cp-grid cols-3">
      <div class="cp-field"><label>من تاريخ</label><input class="cp-input" type="date" value="${STATE.reportsFrom}" onchange="cpReportsDate('from',this.value)"/></div>
      <div class="cp-field"><label>إلى تاريخ</label><input class="cp-input" type="date" value="${STATE.reportsTo}" onchange="cpReportsDate('to',this.value)"/></div>
      <div style="align-self:end;"><button class="cp-btn secondary" onclick="cpPrintReport()">🖨️ طباعة التقرير</button></div>
    </div>
  </div>
  <div class="cp-grid cols-3">
    <div class="cp-card" style="text-align:center;"><div class="cp-h3">إجمالي الإيراد</div><div class="cp-h1" style="font-size:22px;color:var(--red2);">${fmt(totalRevenue)} ج</div></div>
    <div class="cp-card" style="text-align:center;"><div class="cp-h3">عدد الفواتير</div><div class="cp-h1" style="font-size:22px;">${orders.length}</div></div>
    <div class="cp-card" style="text-align:center;"><div class="cp-h3">متوسط الفاتورة</div><div class="cp-h1" style="font-size:22px;">${fmt(orders.length?totalRevenue/orders.length:0)} ج</div></div>
  </div>
  <div class="cp-card">
    <div class="cp-h3" style="margin-bottom:8px;">الإيراد حسب نوع الطلب</div>
    <table class="cp-table"><thead><tr><th>النوع</th><th>الإجمالي</th></tr></thead>
    <tbody>${Object.entries(byKind).map(([k,v])=>`<tr><td>${kindLabel(k)}</td><td>${fmt(v)} ج</td></tr>`).join('') || `<tr><td colspan="2" class="cp-empty">لا يوجد بيانات</td></tr>`}</tbody></table>
  </div>
  <div class="cp-card">
    <div class="cp-h3" style="margin-bottom:8px;">أكثر العملاء (حسب الإيراد)</div>
    <table class="cp-table"><thead><tr><th>العميل</th><th>الإجمالي</th></tr></thead>
    <tbody>${topClients.map(([name,v])=>`<tr><td>${name}</td><td>${fmt(v)} ج</td></tr>`).join('') || `<tr><td colspan="2" class="cp-empty">لا يوجد بيانات</td></tr>`}</tbody></table>
  </div>
  <div class="cp-card">
    <div class="cp-h3" style="margin-bottom:8px;">أكثر الموديلات طلبًا</div>
    <table class="cp-table"><thead><tr><th>الموديل</th><th>عدد المرات</th></tr></thead>
    <tbody>${topModels.map(([name,c])=>`<tr><td>${name}</td><td>${c}</td></tr>`).join('') || `<tr><td colspan="2" class="cp-empty">لا يوجد بيانات</td></tr>`}</tbody></table>
  </div>`;
}

  cpPrintDoc(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>تقرير Cleopatra Press</title>
  <style>body{font-family:Tahoma,Arial,sans-serif;padding:30px;} h1{color:#c8102e;}</style></head>

};

    <tbody>${STATE.employees.map((e,i)=>`<tr><td><input value="${e.name}" onchange="cpUpdateEmp(${i},'name',this.value)"/></td><td><input value="${e.password}" onchange="cpUpdateEmp(${i},'password',this.value)"/></td><td><button class="cp-btn sm ghost" onclick="cpDeleteEmp(${i})">حذف</button></td></tr>`).join('')}</tbody></table>
    <button class="cp-btn sm secondary" style="margin-top:10px;" onclick="cpAddEmp()">+ إضافة موظف</button>
  </div>`;
}
/* ===== دليل المقاسات: عرض وتعديل وإضافة، مع حماية المقاسات المستخدمة في الحسابات ===== */
function protectedLabelsFor(familyKey){
  const protectedSet = new Set();
  Object.values(GROUPS).forEach(g=>{
    if(g.family!==familyKey) return;
    if(g.special==='A'){ protectedSet.add('A4'); protectedSet.add('A3'); }
    else{ protectedSet.add(g.below); protectedSet.add(g.above); }
  });
  REAL_SIZES.forEach(rs=>{
    const g = GROUPS[rs.group];
    if(g && g.family===familyKey) protectedSet.add(rs.label);
  });
  return protectedSet;
}
function familyGuideCardsHTML(){
  const F = getFamilies();
  return Object.keys(F).map(fk=>{
    const fam = F[fk];
    const prot = protectedLabelsFor(fk);
    const rows = fam.sizes.map(([label,count],i)=>{
      const isProtected = prot.has(label);
      return `<tr>
        <td><input value="${label}" ${isProtected?'disabled title="مقاس محمي، مستخدم في حسابات الطباعة/الترقيم"':''} onchange="cpUpdateFamilySize('${fk}',${i},'label',this.value)"/></td>
        <td><input type="number" value="${count}" onchange="cpUpdateFamilySize('${fk}',${i},'count',this.value)"/></td>
        <td>${isProtected? '<span class="cp-badge">محمي</span>' : `<button class="cp-btn sm ghost" onclick="cpDeleteFamilySize('${fk}',${i})">حذف</button>`}</td>
      </tr>`;
    }).join('');
    return `
    <div style="margin-bottom:16px;padding:12px;border:1px solid var(--border);border-radius:12px;">
      <div class="cp-row" style="justify-content:space-between;">
        <b>${fam.label}</b>
        <span class="cp-badge">${fam.base==='gayer'?'جاير ٦٦×٨٨':'عادي ٧٠×١٠٠'}</span>
      </div>
      <table class="cp-table" style="margin-top:8px;">
        <thead><tr><th>المقاس</th><th>عدد القطع في الفرخ الكامل</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="cp-row" style="margin-top:8px;">
        <input class="cp-input" id="newSize_${fk}_label" placeholder="مقاس جديد مثال: 12×18" style="max-width:160px;"/>
        <input class="cp-input" id="newSize_${fk}_count" type="number" placeholder="عدد القطع في الفرخ" style="max-width:160px;"/>
        <button class="cp-btn sm secondary" onclick="cpAddFamilySize('${fk}')">+ إضافة مقاس</button>
      </div>
    </div>`;
  }).join('');
}
window.cpUpdateFamilySize = async function(fk, i, field, val){
  const F = getFamilies();
  if(field==='label') F[fk].sizes[i][0] = val.trim();
  else F[fk].sizes[i][1] = parseFloat(val)||1;
  STATE.settings.families = F;
  await storeSet('cp_settings', STATE.settings);
};
window.cpDeleteFamilySize = async function(fk, i){
  const F = getFamilies();
  const label = F[fk].sizes[i][0];
  if(protectedLabelsFor(fk).has(label)){
    showToast('المقاس ده محمي لأنه مستخدم في حسابات الطباعة/الترقيم، متقدرش تمسحه');
    return;
  }
  F[fk].sizes.splice(i,1);
  STATE.settings.families = F;
  await storeSet('cp_settings', STATE.settings);
  render();
};
window.cpAddFamilySize = async function(fk){
  const labelInput = document.getElementById(`newSize_${fk}_label`);
  const countInput = document.getElementById(`newSize_${fk}_count`);
  const label = labelInput.value.trim();
  const count = parseFloat(countInput.value)||1;
  if(!label){ showToast('اكتب المقاس الأول'); return; }
  const F = getFamilies();
  if(F[fk].sizes.some(s=>s[0]===label)){ showToast('المقاس ده موجود بالفعل في العائلة دي'); return; }
  F[fk].sizes.push([label, count]);
  STATE.settings.families = F;
  await storeSet('cp_settings', STATE.settings);
  render();
};
window.cpAddFamily = async function(){
  const label = document.getElementById('newFamLabel').value.trim();
  const base = document.getElementById('newFamBase').value;
  if(!label){ showToast('اكتب اسم العائلة'); return; }
  const key = 'fam_' + uid();
  const F = getFamilies();
  F[key] = {label, base, sizes:[]};
  STATE.settings.families = F;
  await storeSet('cp_settings', STATE.settings);
  showToast('تمت إضافة العائلة، ضيف لها مقاسات دلوقتي');
  render();
};

window.cpUploadLogo = function(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    STATE.settings.logo = e.target.result;
    await storeSet('cp_settings', STATE.settings);
    showToast('تم تحديث الشعار');
    render();
  };
  reader.readAsDataURL(file);
};
